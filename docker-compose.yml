services:
  db:
    image: postgres:16-alpine
    container_name: sacame-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sacame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sacame}
      POSTGRES_DB: ${POSTGRES_DB:-sacame}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sacame}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
